<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Word Counter Online</title>
 "<meta name="google-site-verification" content="DoQpr4WEetHgRDf3uqguqwW35IOb0yzSQnP5QWv1jTw" />" content="Free online word counter. Count words, characters, sentences and paragraphs instantly.">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 40px 15px;
      color: #222;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 300px;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      font-size: 16px;
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .stat {
      background: #f1f5f9;
      padding: 18px;
      text-align: center;
      border-radius: 8px;
    }

    .number {
      font-size: 26px;
      font-weight: bold;
      display: block;
    }

    .label {
      color: #666;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
      background: #222;
      color: white;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Free Word Counter</h1>

  <p class="intro">
    Count words, characters, sentences and paragraphs instantly.
  </p>

  <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>

  <div class="stats">
    <div class="stat">
      <span class="number" id="wordCount">0</span>
      <span class="label">Words</span>
    </div>

    <div class="stat">
      <span class="number" id="charCount">0</span>
      <span class="label">Characters</span>
    </div>

    <div class="stat">
      <span class="number" id="sentenceCount">0</span>
      <span class="label">Sentences</span>
    </div>

    <div class="stat">
      <span class="number" id="paragraphCount">0</span>
      <span class="label">Paragraphs</span>
    </div>
  </div>

  <button onclick="clearText()">Clear</button>
</div>

<script>
  const textInput = document.getElementById("textInput");

  textInput.addEventListener("input", updateCounter);

  function updateCounter() {
    const text = textInput.value;

    const words = text.trim()
      ? text.trim().split(/\s+/).length
      : 0;

    const characters = text.length;

    const sentences = text.trim()
      ? text.split(/[.!?]+/).filter(sentence => sentence.trim().length > 0).length
      : 0;

    const paragraphs = text.trim()
      ? text.split(/\n\s*\n/).filter(paragraph => paragraph.trim().length > 0).length
      : 0;

    document.getElementById("wordCount").textContent = words;
    document.getElementById("charCount").textContent = characters;
    document.getElementById("sentenceCount").textContent = sentences;
    document.getElementById("paragraphCount").textContent = paragraphs;
  }

  function clearText() {
    textInput.value = "";
    updateCounter();
  }
</script>

</body>
</html>
